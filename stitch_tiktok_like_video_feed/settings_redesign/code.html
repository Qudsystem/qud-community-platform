<!DOCTYPE html>

<html class="dark" lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&amp;family=Be+Vietnam+Pro:wght@300;400;500;600;700&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<script id="tailwind-config">
      tailwind.config = {
        darkMode: "class",
        theme: {
          extend: {
            colors: {
              "primary": "#FF0050",
              "surface": "#0A0A0A",
              "surface-container": "#141414",
              "surface-container-high": "#1C1C1C",
              "on-surface": "#FFFFFF",
              "on-surface-variant": "#A3A3A3",
              "outline": "#262626",
              "secondary": "#29fcf3"
            },
            fontFamily: {
              "headline": ["Plus Jakarta Sans", "sans-serif"],
              "body": ["Be Vietnam Pro", "sans-serif"],
            },
            borderRadius: {
              "DEFAULT": "1rem",
              "lg": "1.5rem",
              "xl": "2rem",
              "full": "9999px"
            },
          },
        },
      }
    </script>
<style>
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }
        .no-scrollbar::-webkit-scrollbar { display: none; }
        .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
        
        .glass-panel {
            background: rgba(20, 20, 20, 0.6);
            backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.05);
        }

        .toggle-checkbox:checked + .toggle-track {
            background-color: #FF0050;
        }
        .toggle-checkbox:checked + .toggle-track .toggle-dot {
            transform: translateX(1.25rem);
        }
    </style>
</head>
<body class="bg-surface text-on-surface font-body min-h-screen pb-32">
<!-- Top Bar -->
<header class="sticky top-0 w-full z-50 bg-surface/80 backdrop-blur-xl border-b border-white/5 flex items-center px-6 h-16">
<button class="flex items-center justify-center w-10 h-10 -ml-2 rounded-full hover:bg-white/5 transition-colors">
<span class="material-symbols-outlined text-2xl">arrow_back</span>
</button>
<h1 class="font-headline font-bold text-lg ml-2">Settings</h1>
</header>
<main class="px-6 py-8 max-w-2xl mx-auto space-y-10">
<!-- Profile Header -->
<section class="flex flex-col items-center gap-4 py-2">
<div class="relative">
<div class="w-24 h-24 rounded-full p-1 bg-gradient-to-tr from-primary via-primary to-secondary">
<div class="w-full h-full rounded-full overflow-hidden border-4 border-surface">
<img class="w-full h-full object-cover" data-alt="Close-up portrait of a trendy young man with neon blue lighting reflecting on his face, cinematic cyberpunk aesthetic" src="https://lh3.googleusercontent.com/aida-public/AB6AXuDrB3-LFmxWEP1msLCcPgfwexUXn7rut5WVsq57LQ7Otbam_uc3wJKjEY6RsaPO3eqDwwZkloOmnSK-bdV7WdU0xuOaXLjxcQCtGvAPeU__GM-F_axgPvH2vWx-aU5nk4jfqsrK5SwGeDz5MUsRvpBwOzF2bCscToAPgNC7nK5zlE4AAwUrgs5HZgNtDhYiPfDF_HzVMTRpffVr1wjbc-JbI8kxovdnLobVnIeNWQKRtGYM2rFPfokTMYtuP7MiJgbrHMr23z12DUk"/>
</div>
</div>
<div class="absolute -bottom-1 left-1/2 -translate-x-1/2 bg-primary px-3 py-1 rounded-full border-2 border-surface shadow-xl shadow-primary/20">
<span class="text-[10px] font-black uppercase tracking-widest text-white whitespace-nowrap">Pro Creator</span>
</div>
</div>
<div class="text-center space-y-1">
<h2 class="font-headline font-extrabold text-2xl">Alex Rivers</h2>
<p class="text-on-surface-variant text-sm font-medium">@creator.one</p>
</div>
</section>
<!-- Account Section -->
<section class="space-y-4">
<h3 class="font-headline text-[11px] uppercase tracking-[0.2em] text-on-surface-variant font-bold px-1">Account &amp; Security</h3>
<div class="glass-panel rounded-xl overflow-hidden divide-y divide-white/5">
<button class="w-full flex items-center justify-between p-4 hover:bg-white/[0.03] transition-colors group">
<div class="flex items-center gap-4">
<div class="w-10 h-10 rounded-full bg-surface-container-high flex items-center justify-center text-on-surface-variant group-hover:text-primary transition-colors">
<span class="material-symbols-outlined text-[22px]">verified_user</span>
</div>
<div class="text-left">
<div class="font-semibold text-[15px]">Security Center</div>
<div class="text-xs text-on-surface-variant">2FA &amp; Active Sessions</div>
</div>
</div>
<span class="material-symbols-outlined text-on-surface-variant group-hover:translate-x-1 transition-transform">chevron_right</span>
</button>
<button class="w-full flex items-center justify-between p-4 hover:bg-white/[0.03] transition-colors group">
<div class="flex items-center gap-4">
<div class="w-10 h-10 rounded-full bg-surface-container-high flex items-center justify-center text-on-surface-variant group-hover:text-primary transition-colors">
<span class="material-symbols-outlined text-[22px]">lock</span>
</div>
<div class="text-left">
<div class="font-semibold text-[15px]">Password</div>
<div class="text-xs text-on-surface-variant">Last changed 3 months ago</div>
</div>
</div>
<span class="material-symbols-outlined text-on-surface-variant group-hover:translate-x-1 transition-transform">chevron_right</span>
</button>
<button class="w-full flex items-center justify-between p-4 hover:bg-white/[0.03] transition-colors group">
<div class="flex items-center gap-4">
<div class="w-10 h-10 rounded-full bg-surface-container-high flex items-center justify-center text-on-surface-variant group-hover:text-primary transition-colors">
<span class="material-symbols-outlined text-[22px]">alternate_email</span>
</div>
<div class="text-left">
<div class="font-semibold text-[15px]">Email</div>
<div class="text-xs text-on-surface-variant truncate max-w-[180px]">creator.one@neonpulse.io</div>
</div>
</div>
<span class="material-symbols-outlined text-on-surface-variant group-hover:translate-x-1 transition-transform">chevron_right</span>
</button>
</div>
</section>
<!-- Privacy Section -->
<section class="space-y-4">
<h3 class="font-headline text-[11px] uppercase tracking-[0.2em] text-on-surface-variant font-bold px-1">Privacy Controls</h3>
<div class="glass-panel rounded-xl overflow-hidden divide-y divide-white/5">
<div class="flex items-center justify-between p-4">
<div class="flex items-center gap-4">
<div class="w-10 h-10 rounded-full bg-surface-container-high flex items-center justify-center text-on-surface-variant">
<span class="material-symbols-outlined text-[22px]">visibility_off</span>
</div>
<div>
<div class="font-semibold text-[15px]">Private Profile</div>
<div class="text-xs text-on-surface-variant">Limit visibility to followers</div>
</div>
</div>
<label class="relative inline-flex items-center cursor-pointer">
<input class="sr-only peer toggle-checkbox" type="checkbox"/>
<div class="w-11 h-6 bg-outline rounded-full toggle-track transition-colors peer-focus:ring-2 peer-focus:ring-primary/20">
<div class="absolute top-1 left-1 bg-white w-4 h-4 rounded-full transition-transform toggle-dot"></div>
</div>
</label>
</div>
<button class="w-full flex items-center justify-between p-4 hover:bg-white/[0.03] transition-colors group">
<div class="flex items-center gap-4">
<div class="w-10 h-10 rounded-full bg-surface-container-high flex items-center justify-center text-on-surface-variant group-hover:text-primary transition-colors">
<span class="material-symbols-outlined text-[22px]">block</span>
</div>
<div class="text-left font-semibold text-[15px]">Blocked Accounts</div>
</div>
<div class="flex items-center gap-2">
<span class="text-xs font-bold text-on-surface-variant">12</span>
<span class="material-symbols-outlined text-on-surface-variant group-hover:translate-x-1 transition-transform">chevron_right</span>
</div>
</button>
</div>
</section>
<!-- Notifications Section -->
<section class="space-y-4">
<h3 class="font-headline text-[11px] uppercase tracking-[0.2em] text-on-surface-variant font-bold px-1">Notifications</h3>
<div class="glass-panel rounded-xl overflow-hidden divide-y divide-white/5">
<div class="flex items-center justify-between p-4">
<div class="flex items-center gap-4">
<div class="w-10 h-10 rounded-full bg-surface-container-high flex items-center justify-center text-on-surface-variant">
<span class="material-symbols-outlined text-[22px]">notifications</span>
</div>
<div class="font-semibold text-[15px]">Push Notifications</div>
</div>
<label class="relative inline-flex items-center cursor-pointer">
<input checked="" class="sr-only peer toggle-checkbox" type="checkbox"/>
<div class="w-11 h-6 bg-outline rounded-full toggle-track transition-colors peer-focus:ring-2 peer-focus:ring-primary/20">
<div class="absolute top-1 left-1 bg-white w-4 h-4 rounded-full transition-transform toggle-dot"></div>
</div>
</label>
</div>
<button class="w-full flex items-center justify-between p-4 hover:bg-white/[0.03] transition-colors group">
<div class="flex items-center gap-4">
<div class="w-10 h-10 rounded-full bg-surface-container-high flex items-center justify-center text-on-surface-variant group-hover:text-primary transition-colors">
<span class="material-symbols-outlined text-[22px]">mail</span>
</div>
<div class="text-left font-semibold text-[15px]">Email Digest</div>
</div>
<div class="flex items-center gap-2">
<span class="text-[10px] font-black uppercase tracking-wider text-primary">Weekly</span>
<span class="material-symbols-outlined text-on-surface-variant group-hover:translate-x-1 transition-transform">chevron_right</span>
</div>
</button>
</div>
</section>
<!-- Danger Zone -->
<section class="pt-6 pb-12">
<button class="w-full h-14 rounded-2xl border border-primary/20 bg-primary/5 flex items-center justify-center gap-3 group active:scale-95 transition-all">
<span class="material-symbols-outlined text-primary group-hover:rotate-180 transition-transform duration-500">logout</span>
<span class="font-headline font-bold text-primary">Log Out</span>
</button>
<div class="mt-12 text-center space-y-4">
<div class="text-[10px] font-black tracking-[0.3em] text-on-surface-variant/50 uppercase">The Electric Cinema v4.2.0</div>
<div class="flex justify-center gap-6">
<a class="text-[10px] font-bold text-on-surface-variant hover:text-primary transition-colors uppercase tracking-widest" href="#">Terms</a>
<a class="text-[10px] font-bold text-on-surface-variant hover:text-primary transition-colors uppercase tracking-widest" href="#">Privacy</a>
<a class="text-[10px] font-bold text-on-surface-variant hover:text-primary transition-colors uppercase tracking-widest" href="#">Support</a>
</div>
</div>
</section>
</main>
<!-- Bottom Nav -->
<nav class="fixed bottom-0 left-0 w-full flex justify-around items-center px-4 pb-8 pt-4 bg-surface/90 backdrop-blur-2xl border-t border-white/5 z-50">
<button class="p-2 text-on-surface-variant/50 hover:text-primary transition-colors">
<span class="material-symbols-outlined text-[28px]">home</span>
</button>
<button class="p-2 text-on-surface-variant/50 hover:text-primary transition-colors">
<span class="material-symbols-outlined text-[28px]">explore</span>
</button>
<button class="relative -top-6 w-14 h-14 rounded-full bg-primary flex items-center justify-center shadow-xl shadow-primary/30 active:scale-90 transition-transform">
<span class="material-symbols-outlined text-white text-3xl font-bold">add</span>
</button>
<button class="p-2 text-on-surface-variant/50 hover:text-primary transition-colors">
<span class="material-symbols-outlined text-[28px]">music_note</span>
</button>
<button class="p-2 text-primary">
<span class="material-symbols-outlined text-[28px]" style="font-variation-settings: 'FILL' 1;">person</span>
</button>
</nav>
</body></html>
