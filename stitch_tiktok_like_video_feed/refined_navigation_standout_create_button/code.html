<style>

    }
    .spinning-vinyl {
      animation: spin 3s linear infinite;
    }
    @keyframes spin {
      from { transform: rotate(0deg); }
      to { transform: rotate(360deg); }
    }
  </style>
<style>
    body {
      min-height: max(884px, 100dvh);
    }

<body class="bg-background text-on-background font-body select-none overflow-hidden h-screen w-screen flex flex-col pb-20">
<!-- TopAppBar Content & Identity from JSON -->
<header class="fixed top-0 left-0 w-full z-50 flex justify-between items-center px-6 h-16 bg-transparent">
<div class="flex items-center">
<span class="material-symbols-outlined text-white text-2xl" data-icon="live_tv">live_tv</span>
</div>
<div class="flex gap-6 items-center">
<button class="font-['Plus_Jakarta_Sans'] font-extrabold text-lg tracking-tighter uppercase text-neutral-400 font-medium hover:text-[#FF0050] transition-colors">Following</button>
<button class="font-['Plus_Jakarta_Sans'] font-extrabold text-lg tracking-tighter uppercase text-white border-b-2 border-[#FF0050] pb-1 hover:text-[#FF0050] transition-colors">For You</button>
</div>
<div class="flex items-center">
<span class="material-symbols-outlined text-white text-2xl" data-icon="search">search</span>
</div>
</header>
<!-- Main Video Canvas -->
<main class="relative flex-grow w-full h-full bg-surface-container-lowest overflow-hidden">
<!-- Mock Video Background -->
<div class="absolute inset-0 z-0">
<img class="w-full h-full object-cover" data-alt="cinematic close-up of a neon-lit cyberpunk city street at night with rain reflections and glowing pink and cyan signs" src="https://lh3.googleusercontent.com/aida-public/AB6AXuC9GbXp1m5nTCUBjPI92q6Gm_hvKhRFN-I1uGhWmUl6tzdka187RTNL2vI81GuwiJGN84qGobNkM4zQTXzrcewEzpL3eoK0Yr5_OD7PT96WLUVaUGa3SBbsR4796A9cRrcSglSde1P9Jc7ybAqmIRI4zrf2mWcjwDhdwd7C2wFJJMAhm4FLTQfn5EAYX-0zAx_48eva2MYAWY9Jnkzc4l9rv-wLrWn2Tm6NPToBPudLCfUoo4U7VsIdHQ9VXGhJ631ZXsX94OZoT0k"/>
</div>
<!-- Interface HUD Overlay -->
<div class="absolute inset-0 z-10 video-overlay-gradient pointer-events-none"></div>
<!-- Interaction HUD (The Right-Rail) -->
<div class="absolute right-4 bottom-32 flex flex-col items-center gap-y-6 z-20 pointer-events-auto">
<!-- Profile Action -->
<div class="relative mb-2">
<div class="w-14 h-14 rounded-full border-2 border-white overflow-hidden ring-offset-2 ring-offset-surface ring-2 ring-primary">
<img class="w-full h-full object-cover" data-alt="portrait of a stylish young creator with neon lighting highlights on hair and face" src="https://lh3.googleusercontent.com/aida-public/AB6AXuAePnPPLrqHQ-xRqp4w9rYDu0jhEELCOc6YQaxpx_Mc6IsxlRkmoVjVS7_LCX7q7X3aIA3X7yiTiiGQZytrZ8F2ZcdrWvt17fkm9kB4SseGMZdtXB5ioUROKektXrf_8R_NFwudQu00ccYQjDR2L_EljXuM4qtctZr5blxd8NA2V3my4xq8dKVkZRdYuIoyBIX59JeWii_WN4TcFjsEkAaxL2aK7q-YMbvyJTZGdNt_p7X2zl9-BKzOz26bszvRUj4N3R7_wAAg1x4"/>
</div>
<div class="absolute -bottom-2 left-1/2 -translate-x-1/2 bg-primary rounded-full w-5 h-5 flex items-center justify-center border-2 border-surface">
<span class="material-symbols-outlined text-[12px] text-on-primary font-bold" data-icon="add">add</span>
</div>
</div>
<!-- Like -->
<button class="flex flex-col items-center gap-1 group">
<div class="p-2 transition-transform active:scale-150 duration-300">
<span class="material-symbols-outlined text-[40px] text-white group-hover:text-primary transition-colors" data-icon="favorite" data-weight="fill" style="font-variation-settings: 'FILL' 1;">favorite</span>
</div>
<span class="font-label font-bold text-xs text-white">1.2M</span>
</button>
<!-- Comment -->
<button class="flex flex-col items-center gap-1 group">
<div class="p-2">
<span class="material-symbols-outlined text-[40px] text-white group-hover:text-secondary transition-colors" data-icon="comment" data-weight="fill" style="font-variation-settings: 'FILL' 1;">comment</span>
</div>
<span class="font-label font-bold text-xs text-white">45.8K</span>
</button>
<!-- Bookmark -->
<button class="flex flex-col items-center gap-1 group">
<div class="p-2">
<span class="material-symbols-outlined text-[40px] text-white group-hover:text-tertiary transition-colors" data-icon="bookmark" data-weight="fill" style="font-variation-settings: 'FILL' 1;">bookmark</span>
</div>
<span class="font-label font-bold text-xs text-white">102K</span>
</button>
<!-- Share -->
<button class="flex flex-col items-center gap-1 group">
<div class="p-2">
<span class="material-symbols-outlined text-[40px] text-white group-hover:text-secondary-dim transition-colors" data-icon="share" data-weight="fill" style="font-variation-settings: 'FILL' 1;">share</span>
</div>
<span class="font-label font-bold text-xs text-white">12K</span>
</button>
</div>
<!-- Description Area -->
<div class="absolute left-4 bottom-28 right-24 z-20 pointer-events-auto">
<div class="flex flex-col gap-2">
<h3 class="font-headline font-extrabold text-lg text-white tracking-tight">@cyber_neon_flux</h3>
<p class="font-body text-sm text-on-surface leading-snug line-clamp-2">
          Lost in the echo of the digital grid. Exploring the neon noir vibes of the underground. ⚡️🌆 #cyberpunk #neon #future #vibe
        </p>
<div class="flex items-center gap-2 mt-1">
<span class="material-symbols-outlined text-sm text-secondary" data-icon="music_note">music_note</span>
<span class="font-label font-medium text-xs text-secondary-dim truncate">Original Sound - @cyber_neon_flux - Midnight Drive</span>
</div>
</div>
</div>

<img class="w-full h-full object-cover opacity-80" data-alt="abstract album art with swirling neon pink and blue colors and grain texture" src="https://lh3.googleusercontent.com/aida-public/AB6AXuDlOd3jxrXJsY536D4UrrengDW_K8j9weit_Z7M68YHfRyQOnreO5je3KQ9UKt-cpFWjlsyy-sg-8C8tGEQjkLPYb1FUdtBko2tS-gLaUKl9XZ-gBNbyhAiSREdkIgsFIzXQRX61Rg6Mhqlvl-47tuk--N3vdupWL67bQwr_XB5-OcXQUe6iFR8sGLMvCZL5Nq-EW_Ku92a_zBjJnitc8RUaChFXuvIb5KAqJy3RLr-GC-kL9uTxs_GeAMrr9rBJscCyjj7CiInxNA"/>

</div>

<!-- Home (Active) -->
<a class="flex flex-col items-center justify-center text-[#FF0050] drop-shadow-[0_0_8px_rgba(255,0,80,0.6)] group transition-all duration-300" href="#">
<span class="material-symbols-outlined text-2xl" data-icon="home">home</span>
<span class="font-['Plus_Jakarta_Sans'] text-[10px] font-semibold uppercase tracking-widest mt-1">Home</span>
</a>
<!-- Explore -->
<a class="flex flex-col items-center justify-center text-gray-400 opacity-60 hover:opacity-100 hover:text-white transition-all duration-300 group" href="#">
<span class="material-symbols-outlined text-2xl" data-icon="explore">explore</span>
<span class="font-['Plus_Jakarta_Sans'] text-[10px] font-semibold uppercase tracking-widest mt-1">Explore</span>
</a>
<!-- Create (Central Highlight) -->

<div class="w-16 h-16 bg-[#FF0050] rounded-full flex items-center justify-center shadow-[0_0_25px_rgba(255,0,80,0.8)] border-4 border-[#201f1f] group-hover:shadow-[0_0_35px_rgba(255,0,80,1)] transition-all">
<span class="material-symbols-outlined text-white text-4xl font-bold" data-icon="add">add</span>
</div>
<span class="font-['Plus_Jakarta_Sans'] text-[10px] font-bold uppercase tracking-[0.15em] mt-2 text-[#FF0050] drop-shadow-[0_0_5px_rgba(255,0,80,0.4)]">Create</span>
</a>
<!-- Activity -->
<a class="flex flex-col items-center justify-center text-gray-400 opacity-60 hover:opacity-100 hover:text-white transition-all duration-300 group" href="#">
<span class="material-symbols-outlined text-2xl" data-icon="favorite">favorite</span>
<span class="font-['Plus_Jakarta_Sans'] text-[10px] font-semibold uppercase tracking-widest mt-1">Activity</span>
</a>
<!-- Profile -->
<a class="flex flex-col items-center justify-center text-gray-400 opacity-60 hover:opacity-100 hover:text-white transition-all duration-300 group" href="#">
<span class="material-symbols-outlined text-2xl" data-icon="person">person</span>
<span class="font-['Plus_Jakarta_Sans'] text-[10px] font-semibold uppercase tracking-widest mt-1">Profile</span>
</a>
